<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Newsroom</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Input Overlay -->
        <div id="input-screen" class="screen active">
            <div class="search-box">
                <h1>AI Newsroom</h1>
                <p>Enter topics for the AI Editor-in-Chief.</p>
                <div class="input-group">
                    <input type="text" id="query-input"
                        placeholder="e.g. Latest advancements in Google Gemini and OpenAI">
                    <div class="button-group" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                        <button id="live-search-btn">Live Search</button>
                        <button id="archive-search-btn" style="background-color: #3b82f6;">Search Archives</button>
                    </div>
                </div>
            </div>
            
            <div class="history-box" style="margin-top: 40px; width: 100%; max-width: 600px; text-align: left;">
                <h3 style="font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px;">Recent Newsletters</h3>
                <ul id="history-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;">
                    <!-- History items injected here -->
                </ul>
            </div>
        </div>

        <!-- Terminal Overlay -->
        <div id="terminal-screen" class="screen">
            <div class="terminal-container">
                <div class="terminal-header">
                    <span></span><span></span><span></span>
                    <p>ADK Runner Execution Log</p>
                </div>
                <div id="terminal-output"></div>
                <div class="loader">Compiling Newsletter...</div>
            </div>
        </div>

        <!-- News Feed Overlay -->
        <div id="news-screen" class="screen">
            <header class="top-nav">
                <div class="logo">Daily🗞️AI</div>
                <div class="nav-search-group" style="display: flex; gap: 8px; align-items: center; margin-left: auto;">
                    <input type="text" id="nav-query-input" placeholder="Search..." style="padding: 8px 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: white;">
                    <button id="new-search-btn" class="nav-btn">New Search</button>
                    <button id="nav-archive-search-btn" class="nav-btn" style="background-color: #3b82f6;">Search Archives</button>
                </div>
            </header>

            <main class="news-layout">
                <div class="feed-col" id="article-grid">
                    <!-- Cards are dynamically injected here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for full article -->
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="Cover">
            <h1 id="modal-title"></h1>
            <div class="modal-meta">
                <span id="modal-sources"></span>
            </div>
            <div id="modal-body"></div>
            <div id="modal-citations"></div>
            <div id="modal-feedback">
                <span class="feedback-label">Was this article useful?</span>
                <button class="feedback-btn" data-score="1">👍</button>
                <button class="feedback-btn" data-score="0">👎</button>
                <span id="feedback-status" class="feedback-status"></span>
            </div>
        </div>
    </div>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>

</html>
